# nginx config for GridForge frontend container.
#
# Responsibilities:
#   1. Serve the Vite-built SPA (all paths → index.html for client-side routing).
#   2. Reverse-proxy /api/* and /ws to the backend container so the browser
#      only ever talks to one origin — no CORS issues in production.
#
# The VITE_API_BASE_URL build arg / env var should be left empty (or "/") when
# using this nginx proxy; all /api requests are forwarded to `gridforge-api:8000`.
# If deploying the frontend without this proxy (e.g. CDN), set VITE_API_BASE_URL
# to the backend's full public URL at build time.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing: unknown paths fall back to index.html ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy REST API to backend ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://gridforge-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Proxy WebSocket connections to backend ───────────────────────────────
    location /ws {
        proxy_pass             http://gridforge-api:8000/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
